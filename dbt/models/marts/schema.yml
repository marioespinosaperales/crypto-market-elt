version: 2

models:
  - name: mart_daily_ohlcv
    description: Daily returns, rolling volatility, and volume per symbol.
    columns:
      - name: close
        data_tests: [not_null, positive_value]
    data_tests:
      - unique_combination:
          arguments:
            combination: [symbol, trade_date]

  - name: mart_market_overview
    description: Total market cap, BTC dominance, and top-10 concentration per day.
    columns:
      - name: snapshot_date
        data_tests: [not_null, unique]
      - name: btc_dominance
        data_tests: [not_null]
