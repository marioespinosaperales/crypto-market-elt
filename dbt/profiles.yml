crypto_market_elt:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Override with ELT_DUCKDB_PATH (Dagster sets it absolutely); the default
      # assumes dbt is run from the repo root (make transform).
      path: "{{ env_var('ELT_DUCKDB_PATH', 'warehouse/crypto.duckdb') }}"
      threads: 4
