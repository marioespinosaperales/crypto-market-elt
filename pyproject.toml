[project]
name = "crypto-market-elt"
version = "0.1.0"
description = "ELT pipeline: crypto market data (CoinGecko + Binance) -> Parquet -> DuckDB -> dbt marts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.14",
    "dagster-dbt>=0.29.14",
    "dagster-webserver>=1.13.14",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "pandera>=0.32.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
