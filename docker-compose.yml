services:
  pipeline:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./warehouse:/app/warehouse
      - ./artifacts:/app/artifacts
    command:
      - sh
      - -c
      - >-
        uv run python -m crypto_market_elt.run
        && ELT_DUCKDB_PATH=warehouse/crypto.duckdb
        uv run dbt build --project-dir dbt --profiles-dir dbt
        && uv run python -m crypto_market_elt.evals

  test:
    build: .
    volumes:
      - ./artifacts:/app/artifacts
    command:
      - sh
      - -c
      - uv run pytest && uv run python -m crypto_market_elt.evals
